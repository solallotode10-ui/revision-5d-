<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Révision & Cours — 5ème D</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --card-border: #2e2e34;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #f3f3f5;
            --text-muted: #8e8e93;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        header {
            max-width: 1100px;
            margin: 0 auto 25px auto;
            text-align: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .main-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }

        .search-box {
            flex: 1;
            min-width: 220px;
        }

        .search-box input {
            width: 100%;
            padding: 9px 12px;
            background: #121214;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            color: var(--text-main);
            outline: none;
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            overflow-x: auto;
        }

        .filter-btn {
            padding: 6px 12px;
            background: #121214;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .filter-btn.active {
            background: #2e2e34;
            color: #ffffff;
            border-color: #44444c;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
            background: #242429;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
        }

        .badge-maths { color: #60a5fa; border-color: #1d4ed8; }
        .badge-francais { color: #f472b6; border-color: #be185d; }
        .badge-histoire { color: #fbbf24; border-color: #b45309; }
        .badge-svt { color: #34d399; border-color: #047857; }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            word-break: break-word;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .btn-view, .btn-download {
            flex: 1;
            padding: 8px;
            text-align: center;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-view {
            background: var(--accent);
            color: #ffffff;
            border: none;
        }

        .btn-view:hover { background: var(--accent-hover); }

        .btn-download {
            background: #121214;
            color: var(--text-muted);
            border: 1px solid var(--card-border);
        }

        .btn-download:hover { color: var(--text-main); }

        .preview-area {
            margin-top: 10px;
            border-radius: 6px;
            overflow: hidden;
            background: #121214;
            border: 1px solid var(--card-border);
            max-height: 250px;
        }

        .preview-area iframe, .preview-area img {
            width: 100%;
            height: 250px;
            border: none;
            object-fit: contain;
        }

        .empty-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            background: var(--card-bg);
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }
    </style>
</head>
<body>

    <header>
        <h1>Révisions & Cours — 5ème D</h1>
        <p class="subtitle">Espace de partage des leçons, devoirs et fiches de révision</p>
    </header>

    <div class="main-container">
        <div class="nav-tabs">
            <button class="tab-btn active" id="tab-revision" onclick="switchSpace('revision')">
                Espace Révision (Fiches & Évaluations)
            </button>
            <button class="tab-btn" id="tab-rattrapage" onclick="switchSpace('rattrapage')">
                Espace Leçons & Rattrapage
            </button>
        </div>

        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Rechercher une fiche ou une leçon..." oninput="filterFiles()">
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="setSubjectFilter('all', this)">Tous</button>
                <button class="filter-btn" onclick="setSubjectFilter('maths', this)">Maths</button>
                <button class="filter-btn" onclick="setSubjectFilter('francais', this)">Français</button>
                <button class="filter-btn" onclick="setSubjectFilter('histoire', this)">Histoire-Géo</button>
                <button class="filter-btn" onclick="setSubjectFilter('svt', this)">SVT</button>
            </div>
        </div>

        <div class="cards-grid" id="cardsGrid">
            <div class="empty-msg">Chargement des fichiers...</div>
        </div>
    </div>

    <script>
        const REPO_OWNER = 'solallotode10-ui';
        const REPO_NAME = 'revision-5d';
        const TARGET_BRANCH = 'main';

        let currentSpace = 'revision';
        let currentSubject = 'all';
        let allFiles = [];

        async function loadSpaceFiles(space) {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '<div class="empty-msg">Chargement des documents...</div>';

            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/content/${space}?ref=${TARGET_BRANCH}`);
                if (!response.ok) {
                    grid.innerHTML = `<div class="empty-msg">Aucun fichier trouvé dans <b>content/${space}/</b>.</div>`;
                    allFiles = [];
                    return;
                }

                const data = await response.json();
                allFiles = data.filter(item => item.type === 'file' && !item.name.startsWith('.'));
                renderFiles();
            } catch (err) {
                grid.innerHTML = `<div class="empty-msg">Erreur de chargement. Vérifie le dossier <b>content/${space}</b> sur GitHub.</div>`;
            }
        }

        function switchSpace(space) {
            currentSpace = space;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${space}`).classList.add('active');
            loadSpaceFiles(space);
        }

        function detectSubject(filename) {
            const name = filename.toLowerCase();
            if (name.includes('math')) return 'maths';
            if (name.includes('franc') || name.includes('fr')) return 'francais';
            if (name.includes('hist') || name.includes('geo')) return 'histoire';
            if (name.includes('svt') || name.includes('phys')) return 'svt';
            return 'autre';
        }

        function setSubjectFilter(subject, btn) {
            currentSubject = subject;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderFiles();
        }

        function filterFiles() {
            renderFiles();
        }

        function renderFiles() {
            const grid = document.getElementById('cardsGrid');
            const query = document.getElementById('searchInput').value.toLowerCase();

            const filtered = allFiles.filter(file => {
                const matchesSubject = (currentSubject === 'all') || (detectSubject(file.name) === currentSubject);
                const matchesSearch = file.name.toLowerCase().includes(query);
                return matchesSubject && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-msg">Aucun document trouvé.</div>';
                return;
            }

            grid.innerHTML = '';
            filtered.forEach(file => {
                const subject = detectSubject(file.name);
                const isPdf = file.name.endsWith('.pdf');
                const isImg = /\.(jpg|jpeg|png|webp|gif)$/i.test(file.name);
                const isTxt = file.name.endsWith('.txt');

                let previewHtml = '';
                if (isPdf || isTxt) {
                    previewHtml = `<div class="preview-area"><iframe src="${file.download_url}"></iframe></div>`;
                } else if (isImg) {
                    previewHtml = `<div class="preview-area"><img src="${file.download_url}" alt="${file.name}"></div>`;
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span class="badge badge-${subject}">${subject}</span>
                        </div>
                        <div class="card-title">${file.name.replace(/\.[^/.]+$/, "").replace(/_/g, " ")}</div>
                    </div>
                    ${previewHtml}
                    <div class="card-actions">
                        <a href="${file.download_url}" target="_blank" class="btn-view">Ouvrir</a>
                        <a href="${file.download_url}" download class="btn-download">Télécharger</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        loadSpaceFiles('revision');
    </script>
</body>
</html>
